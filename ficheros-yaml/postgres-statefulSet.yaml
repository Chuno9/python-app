apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-final
spec:
  serviceName: db-final
  replicas: 1
  selector:
    matchLabels:
      app: db-final
  template:
    metadata:
      labels:
        app: db-final
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_USER
              value: "manu"
            - name: POSTGRES_PASSWORD
              value: "1234"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: topolvm-provisioner
        resources:
          requests:
            storage: 5Gi
